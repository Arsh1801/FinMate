# ===================================================================
# Dev Profile - MySQL 8 Persistent Database
# ===================================================================

spring.datasource.url=${DB_URL:jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:finmate_db}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USER:${DB_USERNAME:finmate}}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Schema initialization: Run schema.sql with CREATE TABLE IF NOT EXISTS
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql

# Hibernate schema handling: do not alter or drop tables/data on startup
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Seeder control
finmate.seeder.enabled=${SEEDER_ENABLED:true}

# JWT Configuration
finmate.jwt.secret=${JWT_SECRET}
finmate.jwt.access-token-expiration-ms=1800000
finmate.jwt.refresh-token-expiration-ms=604800000

# CORS Allowed Origins
finmate.cors.allowed-origins=${CORS_ORIGIN:http://localhost:5173,http://localhost:3000,http://localhost:3001,http://127.0.0.1:5173,http://127.0.0.1:3001}

# Default Admin Seed Credentials (from environment or defaults)
finmate.admin.email=${ADMIN_EMAIL:admin@finmate.local}
finmate.admin.password=${ADMIN_PASSWORD}
finmate.admin.name=System Administrator
