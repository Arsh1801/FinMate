# ===================================================================
# H2 In-Memory Profile - Optional Testing / Demo Environment
# ===================================================================

spring.datasource.url=jdbc:h2:mem:finmatedb;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false

# Seeder control
finmate.seeder.enabled=true

finmate.jwt.secret=${JWT_SECRET}
finmate.jwt.access-token-expiration-ms=1800000
finmate.jwt.refresh-token-expiration-ms=604800000

finmate.admin.email=admin@finmate.local
finmate.admin.password=${ADMIN_PASSWORD}
finmate.admin.name=System Administrator
