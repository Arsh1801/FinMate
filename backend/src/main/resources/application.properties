# ===================================================================
# FinMate Spring Boot Application Configuration
# ===================================================================

spring.application.name=finmate-backend
spring.profiles.active=dev

# Server settings
server.port=8080
server.error.include-stacktrace=never

# Jackson configuration (BR-007: dates ISO-8601, decimal strings/numbers)
spring.jackson.date-format=yyyy-MM-dd
spring.jackson.time-zone=Asia/Kolkata
spring.jackson.serialization.write-dates-as-timestamps=false

# Springdoc OpenAPI Swagger UI
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=alpha
springdoc.swagger-ui.tags-sorter=alpha

# Email Defaults (Console / Log fallback if SMTP is unavailable)
spring.mail.host=localhost
spring.mail.port=1025
spring.mail.username=
spring.mail.password=
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false

# Logging Configuration
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} [traceId=%X{traceId}] - %msg%n
logging.level.com.finmate=INFO
logging.level.org.springframework.web=INFO
