# ===================================================================
# Test Profile - Runs H2 in MySQL Mode with schema.sql
# ===================================================================

spring.datasource.url=jdbc:h2:mem:finmate_test;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false

finmate.seeder.enabled=false

finmate.jwt.secret=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
finmate.jwt.access-token-expiration-ms=1800000
finmate.jwt.refresh-token-expiration-ms=604800000

finmate.admin.email=admin@finmate.local
finmate.admin.password=AdminPassword123!
finmate.admin.name=System Administrator
